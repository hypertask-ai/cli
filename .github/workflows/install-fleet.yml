name: Install fleet CLI

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: install-fleet-cli
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'hypertask-ai/cli' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - hypertask-cli-fleet
    timeout-minutes: 2
    outputs:
      needed: ${{ steps.state.outputs.needed }}
    steps:
      - name: Check installed commit
        id: state
        run: |
          needed=true
          commit_marker="$HOME/.local/state/hypertask-cli/installed-commit"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ -f "$commit_marker" ]; then
            installed_commit=$(cat "$commit_marker")
            if [ "$installed_commit" = "$GITHUB_SHA" ]; then
              needed=false
            fi
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: github.repository == 'hypertask-ai/cli' && github.ref == 'refs/heads/main' && needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
      checksums_sha256: ${{ steps.artifact.outputs.checksums_sha256 }}
      version: ${{ steps.artifact.outputs.version }}
    steps:
      - name: Check out merged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Test ReleaseFast build
        run: zig build test -Doptimize=ReleaseFast

      - name: Test installer
        run: ./scripts/install_fleet_test.sh

      - name: Build ReleaseFast binary
        run: zig build -Doptimize=ReleaseFast

      - name: Prepare fleet artifact
        id: artifact
        run: |
          artifact_dir="$RUNNER_TEMP/fleet-cli"
          mkdir -p "$artifact_dir"
          cp zig-out/bin/hypertask scripts/install-fleet.sh "$artifact_dir/"
          cd "$artifact_dir"
          sha256sum hypertask install-fleet.sh > SHA256SUMS
          checksums_sha256=$(sha256sum SHA256SUMS | awk '{print $1}')
          sha256=$(sha256sum hypertask | awk '{print $1}')
          version=$("$artifact_dir/hypertask" --version)
          test -n "$version"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "checksums_sha256=$checksums_sha256" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload fleet artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fleet-cli
          path: ${{ runner.temp }}/fleet-cli/
          if-no-files-found: error
          retention-days: 1

  install:
    needs: build
    if: github.repository == 'hypertask-ai/cli' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - hypertask-cli-fleet
    timeout-minutes: 10
    steps:
      - name: Download fleet artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fleet-cli
          path: ${{ runner.temp }}/fleet-cli/

      - name: Verify artifact checksums
        env:
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.build.outputs.checksums_sha256 }}
        run: |
          cd "$RUNNER_TEMP/fleet-cli"
          [[ "$EXPECTED_CHECKSUMS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  SHA256SUMS\n' "$EXPECTED_CHECKSUMS_SHA256" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS
          chmod 755 hypertask

      - name: Check installation state
        id: state
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          state_dir="$HOME/.local/state/hypertask-cli"
          commit_marker="$state_dir/installed-commit"
          hash_marker="$state_dir/installed-sha256"
          binary="$HOME/.local/bin/hypertask"
          if [ -x "$binary" ] && [ -f "$commit_marker" ] && [ -f "$hash_marker" ] \
            && grep -Fxq "$GITHUB_SHA" "$commit_marker" \
            && [ "$(cat "$hash_marker")" = "$EXPECTED_SHA256" ] \
            && [ "$(sha256sum "$binary" | awk '{print $1}')" = "$EXPECTED_SHA256" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install fleet binary
        if: steps.state.outputs.needed == 'true'
        run: bash "$RUNNER_TEMP/fleet-cli/install-fleet.sh" "$RUNNER_TEMP/fleet-cli/hypertask"

      - name: Verify installed binary
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          artifact="$RUNNER_TEMP/fleet-cli/hypertask"
          cmp "$artifact" "$HOME/.local/bin/hypertask"
          test -n "$EXPECTED_VERSION"
          test "$("$HOME/.local/bin/hypertask" --version)" = "$EXPECTED_VERSION"
          if path_ht=$(command -v hypertask 2>/dev/null); then
            cmp "$artifact" "$path_ht"
          fi
          if [ -e "$HOME/.npm-global/bin/hypertask" ] || [ -L "$HOME/.npm-global/bin/hypertask" ]; then
            cmp "$artifact" "$HOME/.npm-global/bin/hypertask"
          fi

      - name: Record installed commit
        if: steps.state.outputs.needed == 'true'
        run: |
          state_dir="$HOME/.local/state/hypertask-cli"
          mkdir -p "$state_dir"
          commit_tmp=$(mktemp "$state_dir/installed-commit.XXXXXX")
          hash_tmp=$(mktemp "$state_dir/installed-sha256.XXXXXX")
          trap 'rm -f "$commit_tmp" "$hash_tmp"' EXIT
          sha256sum "$HOME/.local/bin/hypertask" | awk '{print $1}' > "$hash_tmp"
          printf '%s\n' "$GITHUB_SHA" > "$commit_tmp"
          mv "$hash_tmp" "$state_dir/installed-sha256"
          mv "$commit_tmp" "$state_dir/installed-commit"
