name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Install parity-reference Node CLI
        run: npm install --prefix "$RUNNER_TEMP/node-cli" @hypertask/hypertask_cli@2.0.6

      - name: Test auto-merge gate
        run: python3 scripts/automerge_workflow_test.py

      - name: Ensure transport fault-injection dependency
        run: command -v strace || { sudo apt-get update && sudo apt-get install -y strace; }

      - name: Run ReleaseFast tests
        run: zig build test -Doptimize=ReleaseFast

      - name: Build ReleaseFast CLI
        run: zig build -Doptimize=ReleaseFast -Dcpu=baseline

      - name: Check binary runs on baseline x86_64
        run: |
          objdump -d zig-out/bin/hypertask > "$RUNNER_TEMP/hypertask.disassembly"
          if grep -q '%zmm' "$RUNNER_TEMP/hypertask.disassembly"; then
            echo "::error::fleet binary uses AVX-512 registers; baseline x86_64 is required"
            exit 1
          fi

      - name: Test fleet installers and release pull
        run: |
          ./scripts/install_fleet_test.sh
          ./scripts/fleet_pull_test.sh
          shellcheck scripts/fleet-pull.sh scripts/fleet-pull-install.sh scripts/fleet_pull_test.sh

      - name: Test error-path output contract
        run: python3 scripts/output_parity_test.py zig-out/bin/hypertask

      - name: Test URL formats in discovery
        run: |
          python3 scripts/htpr_7323_url_formats_test.py zig-out/bin/hypertask
          python3 scripts/no_login_discovery_test.py zig-out/bin/hypertask

      - name: Test customer installers
        run: |
          ./scripts/install_test.sh
          npm test --prefix npm

      - name: Build Windows x64 CLI
        run: zig build -Doptimize=ReleaseFast -Dtarget=x86_64-windows --prefix "$RUNNER_TEMP/windows-x64"

      - name: Check capability parity
        env:
          HT_TOKEN: ci-read-only-placeholder
          HYPERTASK_NODE_BIN: ${{ runner.temp }}/node-cli/node_modules/.bin/hypertask
        run: python3 scripts/parity_test.py --capabilities-only

      - name: Check architecture
        run: python3 scripts/parity_test.py --architecture-only

      - name: Check live read-only parity
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          # Non-expiring agent JWT (role=read, board 15). Personal logins expire.
          HT_TOKEN: ${{ secrets.HYPERTASK_PARITY_TOKEN }}
          HYPERTASKS_JWT_TOKEN: ${{ secrets.HYPERTASK_PARITY_TOKEN }}
          HYPERTASK_NODE_BIN: ${{ runner.temp }}/node-cli/node_modules/.bin/hypertask
        run: python3 scripts/parity_test.py
